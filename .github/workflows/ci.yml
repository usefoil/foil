name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  local-correction-contract:
    name: Local Correction Engine Contract
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate corpus and production Swift engine
        run: make test-local-correction-engine

  agent-access-contract:
    name: Agent Access Contract
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Run focused Agent Access and performance gates
        env:
          AGENT_ACCESS_RESULT_BUNDLE: AgentAccessResults.xcresult
        run: |
          make test-agent-access
          make test-local-correction-performance

      - name: Upload Agent Access results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-access-results
          path: AgentAccessResults.xcresult
          retention-days: 14
          if-no-files-found: error

  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.detect.outputs.app_ci }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect app-impacting changes
        id: detect
        run: bash .github/scripts/app-ci-required.sh

  build:
    name: Build
    runs-on: macos-15
    timeout-minutes: 15
    needs: [detect-changes]
    if: >-
      always() && !cancelled() &&
      needs.detect-changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Run release script tests
        run: scripts/test-build-notarized-qa-dmg.sh

      - name: Build (warnings as errors)
        run: |
          xcodebuild build \
            -scheme Foil \
            -configuration Debug \
            -destination 'platform=macOS' \
            OTHER_SWIFT_FLAGS='-warnings-as-errors' \
            | xcpretty --color && exit ${PIPESTATUS[0]}

  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 15
    needs: [detect-changes]
    if: >-
      always() && !cancelled() &&
      needs.detect-changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Validate unit test result gate
        run: node --test scripts/ci/tests/unit-test-result.test.mjs scripts/ci/tests/managed-metal-build.test.mjs

      - name: Record managed loopback hostname resolution
        run: |
          python3 - <<'PY'
          import socket
          for host in ("transcribe.foil.localhost", "localhost", "127.0.0.1"):
              try:
                  addresses = sorted({entry[4][0] for entry in socket.getaddrinfo(host, None)})
                  print(f"{host}: {addresses}")
              except OSError as error:
                  print(f"{host}: resolution failed: {error}")
          PY

      - name: Build unit test bundle
        timeout-minutes: 8
        run: |
          # Cold Swift/native/Metal compilation has its own bounded phase.
          # A build failure must stop the job before any test result is accepted.
          xcodebuild build-for-testing \
            -scheme Foil \
            -configuration Debug \
            -derivedDataPath UnitDerivedData \
            -destination 'platform=macOS' \
            -only-testing:FoilTests \
            -skip-testing:FoilTests/LiveGroqIntegrationTests \
            -enableCodeCoverage YES

      - name: Run tests
        id: run-tests
        env:
          RUN_LIVE_GROQ_TESTS: "0"
          TEST_RUNNER_FOIL_MANAGED_STARTUP_TRACE: "1"
        run: |
          # Time test execution separately from the already completed cold build.
          # Run xcodebuild in background so we can send SIGTERM (graceful) on timeout
          # instead of relying on step timeout's SIGKILL (which corrupts xcresult)
          xcodebuild test-without-building \
            -scheme Foil \
            -configuration Debug \
            -derivedDataPath UnitDerivedData \
            -destination 'platform=macOS' \
            -only-testing:FoilTests \
            -skip-testing:FoilTests/LiveGroqIntegrationTests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult &
          XCODE_PID=$!

          # Watchdog: SIGTERM after 7 min (graceful), SIGKILL after 8 min (forced)
          ( sleep 420 && kill -TERM $XCODE_PID 2>/dev/null
            sleep 60  && kill -9    $XCODE_PID 2>/dev/null ) &
          WATCHDOG_PID=$!

          # Wait for xcodebuild to exit (naturally or via watchdog)
          # Disable errexit so non-zero wait (from SIGTERM) doesn't abort before verification
          set +e
          wait $XCODE_PID 2>/dev/null
          TEST_EXIT=$?
          kill $WATCHDOG_PID 2>/dev/null
          wait $WATCHDOG_PID 2>/dev/null
          set -e

          # A bundle can exist after failed or interrupted execution. Never
          # override xcodebuild's failure, even if its summary looks successful.
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "::error::xcodebuild exited with $TEST_EXIT"
            exit "$TEST_EXIT"
          fi
          if [ ! -d TestResults.xcresult ]; then
            echo "::error::Missing test results bundle"
            exit 1
          fi
          SUMMARY_FILE="$(mktemp)"
          trap 'rm -f "$SUMMARY_FILE"' EXIT
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult --compact > "$SUMMARY_FILE"
          node scripts/ci/verify-unit-test-result.mjs "$TEST_EXIT" "$SUMMARY_FILE"

      - name: Verify real precompiled Metal transcription
        env:
          FOIL_REQUIRE_PRECOMPILED_METAL: "1"
        run: |
          bash scripts/test-managed-whisper-runtime.sh --app UnitDerivedData/Build/Products/Debug/Foil.app
          GGML_METAL_BF16_DISABLE=1 bash scripts/test-managed-whisper-runtime.sh --app UnitDerivedData/Build/Products/Debug/Foil.app
          # Device discovery can load Metal before Whisper selects a backend.
          # Prove a successful CPU-only transcript cannot satisfy this gate.
          set +e
          WHISPER_ARG_DEVICE=999 bash scripts/test-managed-whisper-runtime.sh --app UnitDerivedData/Build/Products/Debug/Foil.app > CPUFallbackControl.log 2>&1
          CONTROL_EXIT=$?
          set -e
          if [ "$CONTROL_EXIT" -ne 1 ]; then
            echo "::error::CPU-only negative control did not fail as expected"
            exit 1
          fi
          grep -Fq 'Transcription did not submit a Metal graph' CPUFallbackControl.log
          echo 'PASS: successful CPU-only transcription was rejected by the Metal gate'

      - name: Test summary
        if: always()
        run: |
          append_capped_summary() {
            local source_file="$1"
            local limit_bytes=900000
            local byte_count

            byte_count=$(wc -c < "$source_file" | tr -d ' ')
            if [ "$byte_count" -gt "$limit_bytes" ]; then
              head -c "$limit_bytes" "$source_file" >> "$GITHUB_STEP_SUMMARY"
              {
                echo
                echo
                echo "_Test summary truncated to ${limit_bytes} bytes from ${byte_count} bytes to stay under GitHub's step-summary limit._"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$source_file" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo "## Test Results" >> "$GITHUB_STEP_SUMMARY"
          if [ -d TestResults.xcresult ]; then
            SUMMARY_FILE="$(mktemp)"
            if xcrun xcresulttool get test-results summary \
              --path TestResults.xcresult \
              --compact > "$SUMMARY_FILE" 2>/dev/null; then
              append_capped_summary "$SUMMARY_FILE"
            else
              echo "_Could not parse test results._" >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$SUMMARY_FILE"
          else
            echo "_No test results bundle found._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14

      - name: Generate coverage report
        if: always()
        run: |
          append_capped_summary() {
            local source_file="$1"
            local limit_bytes=900000
            local byte_count

            byte_count=$(wc -c < "$source_file" | tr -d ' ')
            if [ "$byte_count" -gt "$limit_bytes" ]; then
              head -c "$limit_bytes" "$source_file" >> "$GITHUB_STEP_SUMMARY"
              {
                echo
                echo
                echo "_Coverage report truncated to ${limit_bytes} bytes from ${byte_count} bytes to stay under GitHub's step-summary limit._"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$source_file" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          if [ -d TestResults.xcresult ]; then
            xcrun xccov view --report --json TestResults.xcresult > coverage.json 2>/dev/null || true
            echo "## Code Coverage" >> "$GITHUB_STEP_SUMMARY"
            COVERAGE_SUMMARY_FILE="$(mktemp)"
            if xcrun xccov view --report TestResults.xcresult > "$COVERAGE_SUMMARY_FILE" 2>/dev/null; then
              append_capped_summary "$COVERAGE_SUMMARY_FILE"
            else
              echo "_Could not parse coverage report (bundle may be incomplete)._" >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$COVERAGE_SUMMARY_FILE"
          else
            echo "_No test results bundle found; skipping coverage report._"
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: coverage.json
          retention-days: 30
          if-no-files-found: ignore

  agent-access-installed:
    name: Agent Access Installed Smoke
    runs-on: macos-15
    timeout-minutes: 20
    needs: [detect-changes]
    if: >-
      always() && !cancelled() &&
      needs.detect-changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Run signed installed-app Agent Access smoke
        env:
          AGENT_ACCESS_AD_HOC_SIGNING: "1"
          AGENT_ACCESS_SMOKE_ARTIFACT_DIR: /tmp/foil-agent-access-installed
        run: make test-agent-access-installed

      - name: Upload installed-app evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-access-installed-artifacts
          path: /tmp/foil-agent-access-installed
          retention-days: 14
          if-no-files-found: error

  audio-ux-snapshots:
    name: Audio UX Snapshots
    runs-on: macos-15
    timeout-minutes: 15
    needs: [detect-changes]
    if: >-
      always() && !cancelled() &&
      needs.detect-changes.outputs.code == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Render audio UX snapshots
        env:
          SNAPSHOT_OUTPUT_DIR: audio-ux-snapshots
        run: make render-audio-ux-snapshots

      - name: Snapshot summary
        if: always()
        run: |
          echo "## Audio UX Snapshots" >> "$GITHUB_STEP_SUMMARY"
          if [ -f audio-ux-snapshots/receipt.json ]; then
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat audio-ux-snapshots/receipt.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No snapshot receipt generated._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload audio UX snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audio-ux-snapshots
          path: audio-ux-snapshots
          retention-days: 14
          if-no-files-found: error

  ui-tests:
    name: Focused UI Smoke (${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 15
    needs: [detect-changes]
    if: >-
      always() && !cancelled() &&
      needs.detect-changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: balanced-a
            tests: >-
              -only-testing:FoilUITests/FoilUITests/testMicrophoneUnknownShowsCheckAction
              -only-testing:FoilUITests/FoilUITests/testMovedPreferencesLiveInSettingsPanes
              -only-testing:FoilUITests/FoilUITests/testSimulatedRecordingUsesCurrentAppPasteWhenAsyncIsOff
              -only-testing:FoilUITests/FoilUITests/testFloatingStatusAutoHidesAfterSuccessWhenEnabled
              -only-testing:FoilUITests/FoilUITests/testHelpButtonTargetsCanonicalTroubleshootingURL
              -only-testing:FoilUITests/FoilUITests/testAgentAccessDefaultsOffCopiesCommandAndPersistsUntilDisabled
              -only-testing:FoilUITests/FoilUITests/testPreferredTermsScopesSaveAndSurviveGlobalEditsAndRelaunch
          - shard: balanced-b
            tests: >-
              -only-testing:FoilUITests/FoilUITests/testProviderQAOpenAIWhisperPresetShowsCloudSettings
              -only-testing:FoilUITests/FoilUITests/testActiveCleanupModeSelectorPersistsAndScreenshotsResult
              -only-testing:FoilUITests/FoilUITests/testFloatingStatusIsDisabledByDefault
              -only-testing:FoilUITests/FoilUITests/testMicrophoneDeniedShowsOpenSettingsAction
              -only-testing:FoilUITests/FoilUITests/testAgentAccessStartupErrorFailsClosedInSettings
              -only-testing:FoilUITests/FoilUITests/testAgentActionRequiresVisibleFoilApproval
              -only-testing:FoilUITests/FoilUITests/testMixedVocabularyBatchCanOmitAndApplyOnceThenSurviveRelaunch
          - shard: balanced-c
            tests: >-
              -only-testing:FoilUITests/FoilUITests/testProviderQALocalWhisperSetupHelperShowsModelCommands
              -only-testing:FoilUITests/FoilUITests/testProviderQALocalWhisperPresetShowsExpectedSettings
              -only-testing:FoilUITests/FoilUITests/testProviderQAFoilOwnedLocalServerShowsStopControl
              -only-testing:FoilUITests/FoilUITests/testProviderQALocalWhisperStartingShowsStopControlAndBuildIdentity
              -only-testing:FoilUITests/FoilUITests/testCustomHotkeyRecorderIsAccessibleButton
              -only-testing:FoilUITests/FoilUITests/testSimulatedRecordingFailureKeepsRetryVisibleInHistory
              -only-testing:FoilUITests/FoilUITests/testSelectedStartCueIsUsedBeforeRecorderStarts
          - shard: balanced-d
            tests: >-
              -only-testing:FoilUITests/FoilUITests/testAppShellHistoryBulletizeTransformPreservesBulletFormatInDetail
              -only-testing:FoilUITests/FoilUITests/testProviderQADefaultsToGroqPreset
              -only-testing:FoilUITests/FoilUITests/testSimulatedRecordingUsesAsyncPasteWhenEnabled
              -only-testing:FoilUITests/FoilUITests/testSetupCheckCanBeRunInline
              -only-testing:FoilUITests/FoilUITests/testFloatingWarningShowsExpandedClipboardContext
              -only-testing:FoilUITests/FoilUITests/testControlCenterShowsSeededReadyState
              -only-testing:FoilUITests/FoilUITests/testAgentVocabularyProposalRemainsReviewableAfterAccessIsDisabled
              -only-testing:FoilUITests/FoilUITests/testAgentVocabularyProposalReviewedApplyCreatesCatalogEntriesWithoutEnablingSwitch

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Run focused UI smoke
        env:
          ACTIVE_MODE_SCREENSHOT_DIR: /tmp/foil-active-mode-screenshots
          HISTORY_TRANSFORM_SCREENSHOT_DIR: /tmp/foil-history-transform-screenshots
          RESULT_BUNDLE_PATH: UITestResults-${{ matrix.shard }}.xcresult
          UI_TESTS: ${{ matrix.tests }}
        run: |
          xcodebuild test \
            -scheme Foil \
            -configuration Debug \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-device-destinations 1 \
            -enableCodeCoverage NO \
            $UI_TESTS \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            | xcpretty --color && exit ${PIPESTATUS[0]}

      - name: UI test summary
        if: always()
        run: |
          append_capped_summary() {
            local source_file="$1"
            local limit_bytes=900000
            local byte_count

            byte_count=$(wc -c < "$source_file" | tr -d ' ')
            if [ "$byte_count" -gt "$limit_bytes" ]; then
              head -c "$limit_bytes" "$source_file" >> "$GITHUB_STEP_SUMMARY"
              {
                echo
                echo
                echo "_UI test summary truncated to ${limit_bytes} bytes from ${byte_count} bytes to stay under GitHub's step-summary limit._"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              cat "$source_file" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          echo "## UI Test Results" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$RESULT_BUNDLE_PATH" ]; then
            UI_SUMMARY_FILE="$(mktemp)"
            if xcrun xcresulttool get test-results summary \
              --path "$RESULT_BUNDLE_PATH" \
              --compact > "$UI_SUMMARY_FILE" 2>/dev/null; then
              append_capped_summary "$UI_SUMMARY_FILE"
            else
              echo "_Could not parse UI test results._" >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$UI_SUMMARY_FILE"
          else
            echo "_No UI test results bundle found._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: UITestResults-${{ matrix.shard }}.xcresult
          retention-days: 14

  ci-gate:
    name: CI Gate
    runs-on: macos-latest
    timeout-minutes: 5
    if: always()
    needs:
      - local-correction-contract
      - agent-access-contract
      - detect-changes
      - build
      - unit-tests
      - agent-access-installed
      - audio-ux-snapshots
      - ui-tests
    steps:
      - name: Check required jobs
        env:
          CORRECTION_CONTRACT_RESULT: ${{ needs.local-correction-contract.result }}
          AGENT_ACCESS_CONTRACT_RESULT: ${{ needs.agent-access-contract.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.unit-tests.result }}
          AGENT_ACCESS_INSTALLED_RESULT: ${{ needs.agent-access-installed.result }}
          AUDIO_UX_RESULT: ${{ needs.audio-ux-snapshots.result }}
          UI_TEST_RESULT: ${{ needs.ui-tests.result }}
          CODE_CHANGED: ${{ needs.detect-changes.outputs.code }}
        run: |
          if [ "$CORRECTION_CONTRACT_RESULT" != "success" ]; then
            echo "Local correction contract did not pass: $CORRECTION_CONTRACT_RESULT"
            exit 1
          fi
          if [ "$AGENT_ACCESS_CONTRACT_RESULT" != "success" ]; then
            echo "Agent Access contract did not pass: $AGENT_ACCESS_CONTRACT_RESULT"
            exit 1
          fi
          echo "Build: $BUILD_RESULT, Tests: $TEST_RESULT, Agent Access installed: $AGENT_ACCESS_INSTALLED_RESULT, Audio UX: $AUDIO_UX_RESULT, UI Tests: $UI_TEST_RESULT, Code changed: $CODE_CHANGED"
          for result in "$BUILD_RESULT" "$TEST_RESULT" "$AGENT_ACCESS_INSTALLED_RESULT" "$AUDIO_UX_RESULT" "$UI_TEST_RESULT"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job reported: $result"
              exit 1
            fi
            if [ "$CODE_CHANGED" = "true" ] && [ "$result" = "skipped" ]; then
              echo "A required job was skipped for a code or release-critical change"
              exit 1
            fi
          done
          echo "All required jobs passed, or were intentionally skipped for non-code changes"
